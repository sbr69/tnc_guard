[project]
name = "unmask-terms-backend"
version = "0.1.0"
description = "FastAPI backend for Unmask-Terms Legal Document Risk Analyzer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=0.3.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.6",
    "python-multipart>=0.0.20",
    "tldextract>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
